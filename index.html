<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#182747">
    <title>Coffee Masters</title>
    <script>
        // Apply a saved theme before the page paints, so there is no flash
        try {
            const theme = localStorage.getItem("cm-theme");
            if (theme == "light" || theme == "dark") {
                document.documentElement.dataset.theme = theme;
            }
        } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="preload" href="/styles/shared.css" as="fetch" crossorigin>
    <link rel="preload" href="/styles/MenuPage.css" as="fetch" crossorigin>
    <link rel="preload" href="/data/menu.json" as="fetch" crossorigin>

    <script src="/app.js" type="module"></script>

    <link rel="stylesheet" href="/styles/global.css">
    <link rel="manifest" href="/app.webmanifest">
    <link rel="apple-touch-icon" href="/images/icons/icon.png">
    <link rel="icon" href="/images/icons/icon.png">
</head>

<body>
    <header>
        <h1><img class="logo" src="/images/logo.svg" width="150" height="32" alt="Coffee Masters"></h1>
        <!-- Tabs sit in the header on wide screens and at the bottom on phones -->
        <nav class="tabs" aria-label="Main" data-i18n-label="nav.main">
            <a class="navlink" id="linkHome" href="/" aria-label="Menu" data-i18n-label="nav.menu">
                <span class="material-symbols-outlined" aria-hidden="true">local_cafe</span>
                <span class="label" data-i18n="nav.menu">Menu</span>
            </a>
            <a class="navlink" id="linkOrders" href="/orders" aria-label="Order history" data-i18n-label="nav.orders">
                <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
                <span class="label" data-i18n="nav.historyShort">History</span>
            </a>
            <a class="navlink" id="linkOrder" href="/order" aria-label="Cart" data-i18n-label="nav.cart">
                <span class="material-symbols-outlined" aria-hidden="true">shopping_bag</span>
                <span class="label" data-i18n="nav.cartShort">Cart</span>
                <span id="badge" hidden></span>
            </a>
        </nav>
        <div class="settings">
            <button type="button" id="language" data-i18n="language.switchShort" data-i18n-label="language.switch"></button>
            <button type="button" id="theme" class="material-symbols-outlined"></button>
        </div>
    </header>

    <main></main>

    <footer>
        <img class="logo" src="/images/logo.svg" width="118" height="25" alt="">
        <p>© <span id="year"></span> Coffee Masters. <span data-i18n="footer.rights">All rights reserved.</span></p>
    </footer>

    <toast-message></toast-message>

    <template id="menu-page-template">
        <div class="banner">
            <h2 class="greeting" data-i18n="menu.greeting">What would you like today?</h2>
            <form class="filters" role="search">
                <div class="search">
                    <input id="search" type="search" aria-label="Search the menu" placeholder="Search the menu" autocomplete="off" data-i18n-label="menu.search" data-i18n-placeholder="menu.search">
                    <span class="icon" aria-hidden="true">search</span>
                </div>
            </form>
        </div>
        <div class="content">
            <div class="chips" role="group" aria-label="Categories" data-i18n-label="menu.categories"></div>
            <section>
                <ul id="menu"></ul>
            </section>
        </div>
    </template>

    <template id="product-item-template">
        <article>
            <a>
                <img alt="" loading="lazy">
                <section>
                    <h4></h4>
                    <p class="price"></p>
                    <div class="actions">
                        <button type="button" class="favourite" aria-pressed="false"></button>
                        <button type="button" class="add">
                            <span class="icon" aria-hidden="true">add_shopping_cart</span>
                            <span data-i18n="product.add">Add</span>
                        </button>
                    </div>
                </section>
            </a>
        </article>
    </template>

    <template id="order-form-template">
        <form novalidate>
            <label for="name" data-i18n="order.name">Your Name</label>
            <input id="name" name="name" autocomplete="name" required aria-describedby="name-error">
            <p class="error" id="name-error" aria-live="polite"></p>
            <label for="phone" data-i18n="order.phone">Your Phone Number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required aria-describedby="phone-error">
            <p class="error" id="phone-error" aria-live="polite"></p>
            <label for="email" data-i18n="order.email">Your Email</label>
            <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
            <p class="error" id="email-error" aria-live="polite"></p>
            <button type="submit" data-i18n="order.place">Place Order</button>
        </form>
    </template>

    <template id="details-page-template">
        <a href="/" class="back">
            <span class="icon" aria-hidden="true">arrow_back</span>
            <span data-i18n="details.back">Back</span>
        </a>
        <img src="" alt="">
        <h2></h2>
        <p class="description"></p>
        <form class="options"></form>
        <div class="buy-bar">
            <p class="price"></p>
            <button type="button" class="add-to-cart" data-i18n="details.addToCart">Add to cart</button>
        </div>
    </template>

    <template id="cart-item-template">
        <li>
            <img class="thumb" alt="">
            <div class='details'>
                <p class='name'></p>
                <p class='options'></p>
            </div>
            <p class='toolbar'>
                <button type="button" class="delete-button">
                    <span class="icon" aria-hidden="true">delete</span>
                </button>
            </p>
            <p class='quantity'>
                <button type="button" class="decrease"><span class="icon" aria-hidden="true">remove</span></button>
                <span class='qty'></span>
                <button type="button" class="increase"><span class="icon" aria-hidden="true">add</span></button>
            </p>
            <p class='price'></p>
        </li>
    </template>

    <template id="confirmation-page-template">
        <section>
            <div class="check"><span class="icon" aria-hidden="true">check</span></div>
            <h2></h2>
            <p class="number"></p>
            <ul></ul>
            <p class="total"></p>
            <a href="/" class="back" data-i18n="common.backToMenu">Back to menu</a>
        </section>
    </template>
</body>
</html>
