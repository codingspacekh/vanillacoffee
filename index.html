<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Coffee Masters</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="preload" href="/components/MenuPage.css" as="fetch" crossorigin>
    <link rel="preload" href="/data/menu.json" as="fetch" crossorigin>

    <script src="/app.js" defer type="module"></script>

    <link rel="stylesheet" href="/styles.css">
    <link rel="manifest" href="/app.webmanifest">
    <link rel="apple-touch-icon" href="/images/icons/icon.png">
    <link rel="icon" href="/images/icons/icon.png">
</head>

<body>
    <header>
        <h1><img src="/images/logo.svg" width="140" alt="Coffee Masters"></h1>
        <nav>
            <a class="navlink material-symbols-outlined" id="linkHome" href="/" aria-label="Menu">
                    local_cafe
            </a>
            <a class="navlink material-symbols-outlined" id="linkOrders" href="/orders" aria-label="Order history">
                    receipt_long
            </a>
            <a class="navlink material-symbols-outlined" id="linkOrder" href="/order" aria-label="Cart">
                    shopping_cart
            </a>
            <span id="badge" hidden></span>
        </nav>
    </header>

    <main></main>

    <toast-message></toast-message>

    <template id="menu-page-template">
        <frontendmasters-genius-code></frontendmasters-genius-code>
        <form class="filters" role="search">
            <input id="search" type="search" aria-label="Search the menu" placeholder="Search the menu" autocomplete="off">
            <div class="chips" role="group" aria-label="Categories"></div>
        </form>
        <section>
            <ul id="menu"></ul>
        </section>
    </template>

    <template id="product-item-template">
        <article>
            <a href="#">
                <button type="button" class="favourite" aria-pressed="false"></button>
                <img alt="">
                <section>
                    <div>
                        <h4></h4>
                        <p class="price"></p>
                    </div>
                    <button type="button" class="add">Add</button>
                </section>
            </a>
        </article>
    </template>

    <template id="order-form-template">
        <form novalidate>
            <label for="name">Your Name</label>
            <input id="name" name="name" autocomplete="name" required aria-describedby="name-error">
            <p class="error" id="name-error" aria-live="polite"></p>
            <label for="phone">Your Phone Number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required aria-describedby="phone-error">
            <p class="error" id="phone-error" aria-live="polite"></p>
            <label for="email">Your Email</label>
            <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
            <p class="error" id="email-error" aria-live="polite"></p>
            <button type="submit">Place Order</button>
        </form>
    </template>

    <template id="details-page-template">
        <header>   
            <a href="#" onclick="app.router.go('/'); event.preventDefault()">&lt; Back</a>
            <h2></h2>
            <a></a>
        </header>
        <img src="">
        <p class="description"></p>
        <form class="options"></form>
        <p class="price"></p>
        <button>Add to cart</button>
    </template>

    <template id="cart-item-template">
        <li>
            <p class='quantity'>
                <button type="button" class="decrease">−</button>
                <span class='qty'></span>
                <button type="button" class="increase">+</button>
            </p>
            <div class='details'>
                <p class='name'></p>
                <p class='options'></p>
            </div>
            <p class='price'></p>
            <p class='toolbar'>
                <a href="#" class="delete-button">
                    🗑️
                </a>
            </p>
        </li>
    </template>

    <template id="confirmation-page-template">
        <section>
            <h2></h2>
            <p class="number"></p>
            <ul></ul>
            <p class="total"></p>
            <a href="/" class="back">Back to menu</a>
        </section>
    </template>
</body>
</html>
